[package]
name = "aurek"
version = "2.1.1"
edition = "2021"
description = "A security wrapper around yay that checks AUR packages for malware before installation"
authors = ["Dipanjan Dutta <relic.of.sky@gmail.com>"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tempfile = "3.14"
colored = "2.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "7.0"
regex = "1.11"
